allowBuilds:
  bufferutil: true
  esbuild: true
  unrs-resolver: true
  utf-8-validate: true
dedupePeerDependents: true
minimumReleaseAge: 3600
minimumReleaseAgeExclude:
  - "@pob/*"
  - pob
  - pob-dependencies
  - check-package-dependencies
  - alouette
  - alouette-icons
  - nightingale
  - nightingale-logger
  - mingo@7.2.5
  # Renovate security update: vite@8.2.4
  - vite@8.2.4
nodeLinker: hoisted
packages:
  - packages/*
  - "@todo-example/*"
savePrefix: ^
